name: Carehold - Verify only (manual, no deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (until a reviewed npm lockfile is committed)
        run: npm install --no-audit --no-fund
      - name: Preflight staging target (local config only)
        run: npm run preflight:staging
      - name: Verify without deploy, migrations, or cloud secrets
        run: npm run verify:pre-e2e
